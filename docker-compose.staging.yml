version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: dabbu-traefik-staging
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@dabbu.app"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-data:/letsencrypt"
    networks:
      - dabbu-staging

  mysql:
    image: mysql:8.0
    container_name: dabbu-mysql-staging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-staging_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dabbu_staging}
      MYSQL_USER: ${MYSQL_USER:-dabbu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dabbu_staging_pass}
    volumes:
      - mysql-staging-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dabbu-staging
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: dabbu-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD:-dabbu_staging_redis}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dabbu-staging
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: dabbu-api-staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: mysql://${MYSQL_USER:-dabbu}:${MYSQL_PASSWORD:-dabbu_staging_pass}@mysql:3306/${MYSQL_DATABASE:-dabbu_staging}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dabbu_staging_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret_change_me}
      SENTRY_ENVIRONMENT: staging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-staging.rule=Host(`api-staging.dabbu.app`)"
      - "traefik.http.routers.api-staging.tls=true"
      - "traefik.http.routers.api-staging.tls.certresolver=letsencrypt"
    networks:
      - dabbu-staging
    deploy:
      resources:
        limits:
          memory: 256M

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: production
    container_name: dabbu-admin-staging
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: https://api-staging.dabbu.app/api/v1
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-staging.rule=Host(`admin-staging.dabbu.app`)"
      - "traefik.http.routers.admin-staging.tls=true"
      - "traefik.http.routers.admin-staging.tls.certresolver=letsencrypt"
    networks:
      - dabbu-staging
    deploy:
      resources:
        limits:
          memory: 128M

  db-migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: dabbu-migrate-staging
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-dabbu}:${MYSQL_PASSWORD:-dabbu_staging_pass}@mysql:3306/${MYSQL_DATABASE:-dabbu_staging}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dabbu-staging

volumes:
  mysql-staging-data:
  traefik-data:

networks:
  dabbu-staging:
    driver: bridge
