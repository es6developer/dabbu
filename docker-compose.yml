version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dabbu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dabbu_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dabbu}
      MYSQL_USER: ${MYSQL_USER:-dabbu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dabbu_pass_2024}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dabbu-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-dabbu_redis_2024}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: dabbu-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./server/src:/app/src
      - ./server/nest-cli.json:/app/nest-cli.json
      - ./server/tsconfig.json:/app/tsconfig.json
      - ./server/tsconfig.build.json:/app/tsconfig.build.json
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

volumes:
  mysql_data:
  redis_data:
